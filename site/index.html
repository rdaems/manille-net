<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="s0" viewBox="0 0 32 32"><path d="M16 2C28 12 30 17.5 30 21a7 7 0 0 1-12.6 4.2c.3 2 1.1 3.6 2.9 4.8h-8.6c1.8-1.2 2.6-2.8 2.9-4.800A7 7 0 0 1 2 21C2 17.5 4 12 16 2z"/></symbol>
  <symbol id="s1" viewBox="0 0 32 32"><path d="M16 29C4 19 2 13.5 2 10.200a7.2 7.2 0 0 1 14-2.4 7.2 7.2 0 0 1 14 2.400C30 13.5 28 19 16 29z"/></symbol>
  <symbol id="s2" viewBox="0 0 32 32"><circle cx="16" cy="9" r="6.4"/><circle cx="8.6" cy="19" r="6.4"/><circle cx="23.4" cy="19" r="6.4"/><circle cx="16" cy="16.5" r="3.5"/><path d="M16 17c-.3 6.5-1.3 10.4-4.3 13h8.600c-3-2.6-4-6.5-4.3-13z"/></symbol>
  <symbol id="s3" viewBox="0 0 32 32"><path d="M16 1.5 28 16 16 30.5 4 16z"/></symbol>
</svg>

<!-- the start screen -->
<section id="home">
  <div class="fan" aria-hidden="true"></div>
  <h1>Manillen</h1>
  <p class="sub"></p>
  <div class="choices">
    <button class="btn main" id="continue" hidden>Verder spelen <small></small></button>
    <button class="btn main" id="new">Nieuw spel</button>
    <button class="btn" id="homeRules">Regels</button>
    <button class="btn" id="install" hidden>Zet op je startscherm</button>
  </div>
  <p class="record" id="record"></p>
</section>

<!-- the table -->
<main id="table" hidden>
  <header>
    <button id="score" aria-label="Scorebord openen"><span>wij <b id="us">0</b></span><span>zij <b id="them">0</b></span></button>
    <button id="menuBtn">Menu</button>
  </header>

  <section class="seat" id="north" data-seat="2"><div class="plate"><span class="who"></span><span class="badge"></span></div><div class="backs"></div><div class="say"></div></section>
  <section class="seat" id="west" data-seat="1"><div class="plate"><span class="who"></span><span class="badge"></span></div><div class="backs"></div><div class="say"></div></section>
  <section class="seat" id="east" data-seat="3"><div class="plate"><span class="who"></span><span class="badge"></span></div><div class="backs"></div><div class="say"></div></section>

  <section id="middle"><div id="trick"></div></section>

  <div id="line">
    <p id="status" role="status" aria-live="polite"></p>
    <div id="offer" hidden><button class="go"></button><button class="x" aria-label="Niet doen">×</button><i></i></div>
  </div>
  <section class="seat" id="south" data-seat="0">
    <div class="plate"><span class="who">Jij</span><span class="badge"></span><button id="lastBtn" hidden>Vorige slag</button></div>
    <div id="hand"></div>
    <div class="say"></div>
  </section>
</main>

<dialog id="ask"><div class="panel"></div></dialog>
<dialog id="sheet"><div class="panel"></div></dialog>

<script type="module" src="js/ui.js"></script>
</body>
</html>
